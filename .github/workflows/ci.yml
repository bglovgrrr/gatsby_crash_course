# Runs on every push and pull request. Shows a ✅ or ❌ next to each commit on GitHub.
name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
